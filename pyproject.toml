[project]
name = "premarket-agent"
version = "0.1.0"
description = "AI agent that writes a pre-market research report for NQ/ES futures every trading morning."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feedparser>=6.0.14",
    "holidays>=0.106",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "yfinance>=1.7.0",
]

[project.scripts]
premarket-agent = "premarket_agent.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/premarket_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade,
# SIM: simplifications, RUF: ruff-specific checks
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
