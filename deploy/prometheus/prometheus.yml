global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pushgateway
    # Keep the job/instance labels the agent pushed, instead of overwriting them
    # with the Pushgateway's own. Without this every metric would say job="pushgateway".
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
